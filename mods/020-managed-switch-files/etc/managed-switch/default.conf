# AX53 managed-switch defaults
#
# Safe stock-compatible router-on-a-stick profile:
#   WAN physical port -> VLAN 4094 untagged
#   LAN1              -> VLAN 4094 + VLAN 2 tagged (trunk to Proxmox)
#   LAN2/LAN3/LAN4    -> VLAN 2 untagged
#   CPU               -> VLAN 2 tagged, preserving eth1.2 for AX53 LAN/Wi-Fi
#   CPU               -> NOT a member of WAN VLAN
#
# This file is a factory template. Runtime state is copied to:
#   /tp_data/managed-switch/config
#
# The profile is intentionally disabled after flash.
enabled=0
profile=router-on-a-stick
wan_vid=4094
lan_vid=2
trunk_port=1
access_ports="2 3 4"
cpu_lan=1
cpu_wan=0
